name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the engines floor; 24 is what most contributors run.
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only: everything under tests/int-* spawns a real Claude Code
      # session and needs credentials, so it cannot run on a public runner.
      - run: npm run test:unit
